<!doctype html>
<!--
  Classic-build e2e: open this file directly (file://), no server.
  A file:// page has an opaque origin and cannot load module scripts; the
  classic build must work there. Build first: npm run build.
  Results land in window.__E2E__ = { done, passed, failed, results }.
-->
<html>
<head><meta charset="utf-8"><title>vivarium classic build e2e (file://)</title></head>
<body>
<p id="status">running…</p>
<ul id="results"></ul>
<div id="stage"></div>
<script src="../dist/vivarium.iife.js"></script>
<script>
(async function () {
  const results = [];
  const record = (name, ok, detail) => {
    results.push({ name, ok, detail: detail === undefined ? null : String(detail) });
    const li = document.createElement("li");
    li.textContent = (ok ? "PASS " : "FAIL ") + name + (detail !== undefined ? " — " + detail : "");
    document.getElementById("results").append(li);
  };
  try {
    record("page is on file://", location.protocol === "file:", location.protocol);
    record("classic script assigned the global", typeof Vivarium === "object" && typeof Vivarium.mountSandbox === "function");

    const registry = new Vivarium.CapabilityRegistry();
    const invoked = [];
    registry.grant({ name: "data.rows", description: "rows" }, () => {
      invoked.push(true);
      return ["첫째", "둘째"];
    });
    const handle = Vivarium.mountSandbox(document.getElementById("stage"), { registry });
    await handle.whenReady();
    record("sandbox handshake completes from a file:// host", true);

    await handle.render(`
      export default async function mount(root, api) {
        const rows = await api.invoke("data.rows");
        const ul = document.createElement("ul");
        for (const r of rows) { const li = document.createElement("li"); li.textContent = r; ul.append(li); }
        root.append(ul);
      }
    `);
    const ids = await handle.listIds();
    const described = await handle.describeElements(ids.map((e) => e.id));
    record(
      "render → capability → stable ids → describe",
      invoked.length === 1 && ids.length === 3 && described.some((d) => d.text === "둘째"),
      JSON.stringify(described.map((d) => [d.tag, d.text])),
    );

    const faults = [];
    handle.onFault((f) => faults.push(f));
    await handle.render(`export default (root) => { setTimeout(() => { throw new Error("late"); }, 10); };`);
    await new Promise((r) => setTimeout(r, 150));
    record("post-mount fault reaches the host", faults.length === 1 && /late/.test(faults[0].message), JSON.stringify(faults));

    try {
      await handle.render(`export default () => { throw new Error("up"); };`);
      record("mount-time throw rejects as GENERATED_CODE_FAULT", false, "resolved");
    } catch (err) {
      record(
        "mount-time throw rejects as GENERATED_CODE_FAULT",
        err instanceof Vivarium.RpcError && err.code === Vivarium.GENERATED_CODE_FAULT,
        err && err.code,
      );
    }
    handle.destroy();

    // Inline sources: a picture the guest builds from bytes it holds loads
    // only when the host opts in, and a network image stays blocked either way.
    const probeSources = async (inlineSources) => {
      const reg = new Vivarium.CapabilityRegistry();
      let report = null;
      reg.grant({ name: "report", description: "probe result" }, (r) => { report = r; return true; });
      const h = Vivarium.mountSandbox(document.getElementById("stage"), { registry: reg, inlineSources });
      await h.whenReady();
      await h.render(`
        const GIF = "R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7";
        const WAV = "UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA=";
        const bytes = (b64) => Uint8Array.from(atob(b64), (c) => c.charCodeAt(0));
        const image = (src) => new Promise((resolve) => {
          const img = new Image();
          img.onload = () => resolve("loaded");
          img.onerror = () => resolve("blocked");
          img.src = src;
          setTimeout(() => resolve("timeout"), 3000);
        });
        export default async function mount(root, api) {
          const violations = [];
          document.addEventListener("securitypolicyviolation", (e) => {
            violations.push(e.effectiveDirective + " " + e.blockedURI.split(":")[0]);
          });
          const blobUrl = URL.createObjectURL(new Blob([bytes(GIF)], { type: "image/gif" }));
          const result = {
            data: await image("data:image/gif;base64," + GIF),
            blob: await image(blobUrl),
            https: await image("https://example.com/pixel.gif"),
          };
          const audio = document.createElement("audio");
          audio.src = "data:audio/wav;base64," + WAV;
          root.append(audio);
          await new Promise((r) => setTimeout(r, 200));
          result.violations = violations.sort();
          await api.invoke("report", result);
        }
      `);
      h.destroy();
      return report;
    };

    const closed = await probeSources(undefined);
    record(
      "without inlineSources no image or media source loads",
      closed.data === "blocked" && closed.blob === "blocked" && closed.https === "blocked" &&
        closed.violations.includes("img-src data") && closed.violations.includes("media-src data"),
      JSON.stringify(closed),
    );
    const images = await probeSources({ images: true });
    record(
      "inlineSources.images loads data: and blob: images, not network ones, and leaves media closed",
      images.data === "loaded" && images.blob === "loaded" && images.https === "blocked" &&
        images.violations.includes("img-src https") && images.violations.includes("media-src data") &&
        !images.violations.includes("img-src data") && !images.violations.includes("img-src blob"),
      JSON.stringify(images),
    );
    const media = await probeSources({ images: true, media: true });
    record(
      "inlineSources.media admits data: audio",
      !media.violations.some((v) => v.startsWith("media-src")) && media.violations.includes("img-src https"),
      JSON.stringify(media),
    );
  } catch (err) {
    record("harness error", false, err && err.stack || err);
  }
  const passed = results.filter((r) => r.ok).length;
  window.__E2E__ = { done: true, passed, failed: results.length - passed, results };
  document.getElementById("status").textContent = results.length === passed ? "ALL PASS (" + passed + ")" : "FAILURES";
})();
</script>
</body>
</html>
