name: test

on:
  push:
    branches: [main]
  pull_request:

# Supersede in-flight runs of the same branch: on a PR only the newest push is
# worth checking. main is exempt — each commit there is a release gate, and a
# cancelled run leaves that commit with no verdict.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  # The behaviour only a real browser can show — the sandbox's opaque origin,
  # the document CSP, identity across live re-renders, bridge error codes, the
  # classic build on file:// — lives in test/e2e*.html. Each page judges itself;
  # tools/run-e2e.ts opens them and fails the job on any failed assertion.
  # It drives the Chrome the runner already has (ubuntu-latest ships one) and
  # downloads nothing; if an image ever drops it, this fails loudly rather than
  # skipping the only check that looks at a browser.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm ci
      # e2e-file.html loads dist/vivarium.iife.js; e2e-react.html loads test/assets.
      - run: npm run build
      - run: node tools/build-profile-assets.ts
      - run: npm run test:e2e

  # Consumer-contact smoke: a fresh consumer package installs this
  # repo and imports the public surface — catches breakage that only shows up
  # at first consumer contact (dangling deps, unresolvable exports).
  consumer-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      # Exports point at dist/ — build it first (folder installs don't run prepack).
      - run: npm ci
      - run: npm run build
      # The classic build (dist/vivarium.iife.js) parses as a Script and its
      # global carries exactly the package root's exports.
      - run: node tools/verify-iife.ts
      - name: Fresh consumer installs and imports @vivariumjs/runtime
        run: |
          mkdir "$RUNNER_TEMP/consumer" && cd "$RUNNER_TEMP/consumer"
          echo '{"name":"consumer","private":true,"type":"module"}' > package.json
          npm install --no-audit --no-fund "$GITHUB_WORKSPACE"
          node -e "import('@vivariumjs/runtime').then((m) => { const n = Object.keys(m).length; if (!n) throw new Error('empty surface'); console.log('imported', n, 'exports'); }).catch((e) => { console.error(e); process.exit(1); })"
      # Docs-example verification: the getting-started fences are
      # extracted and type-checked against the packed tarball, as a consumer.
      - name: Getting-started examples compile as a fresh npm consumer
        run: node tools/verify-docs-examples.ts
      # ── engines.node floor, executed ───────────────────────────────────
      # `engines.node` is a promise to consumers, and nothing was running it:
      # every job pinned the current release, so the declared floor was a claim
      # no CI step could falsify. Build on current, then re-run the fresh
      # consumer's import on the floor itself.
      - name: The pinned floor still matches engines.node
        run: |
          declared=$(node -p "require('./package.json').engines.node")
          if [ "$declared" != ">=20" ]; then
            echo "engines.node is '$declared' but this job runs 20; change both together" >&2
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: A fresh consumer imports @vivariumjs/runtime on Node 20
        run: |
          cd "$RUNNER_TEMP/consumer"
          node --version
          node -e "import('@vivariumjs/runtime').then((m) => { const n = Object.keys(m).length; if (!n) throw new Error('empty surface on the declared floor'); console.log('floor ok —', n, 'exports'); }).catch((e) => { console.error(e); process.exit(1); })"
